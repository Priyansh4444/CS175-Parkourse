name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  UV_PYTHON: '3.11'

jobs:
  types:
    name: Lint, types, and protocol test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.7'
      - run: npm ci
      - run: npm run check
      - run: shellcheck scripts/headless scripts/headful

  minecraft:
    name: Headless Minecraft (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.7'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - run: npm ci
      - run: uv run --locked python scripts/smoke.py
        env:
          MINECRAFT_EULA: 'true'
