name: CI

on:
  pull_request:
  push:
    branches: [verify/parkourse-ci]

permissions:
  contents: read

jobs:
  types:
    name: Type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run check
      - run: bash -n scripts/headless && bash -n scripts/headful

  minecraft:
    name: Headless Minecraft (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - run: npm ci
      - run: python scripts/smoke.py
        env:
          MINECRAFT_EULA: 'true'
