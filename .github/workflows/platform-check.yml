name: Minecraft platform check
on:
  push:
    branches: [verify/macos-windows]
permissions:
  contents: read
jobs:
  minecraft:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Start a real server and jump after loading a save folder
        run: python .github/platform-check.py server
      - name: Connect a graphical Minecraft client and spectate
        run: python .github/platform-check.py client
      - name: Save Minecraft test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-${{ matrix.os }}
          path: platform-runtime/*.log
