name: Minecraft platform check
on:
  push:
    branches: [verify/macos-windows]
permissions:
  contents: read
jobs:
  minecraft:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Start a real server and jump after loading a save folder
        run: python .github/platform-check.py server
      - name: Set up software OpenGL for the Windows VM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = 'https://github.com/pal1000/mesa-dist-win/releases/download/25.2.8/mesa3d-25.2.8-release-msvc.7z'
          curl.exe -fsSL --retry 2 $url -o mesa.7z
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-FileHash mesa.7z).Hash -ne 'e47cfe0be35f0c40c3d488c0e965d10656154ed55cfdfe4f4d79d4395672dc02') { throw 'Mesa download hash mismatch' }
          7z x mesa.7z -omesa
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $dllPath = Join-Path $env:JAVA_HOME 'bin'
          Copy-Item mesa/x64/opengl32.dll, mesa/x64/libgallium_wgl.dll -Destination $dllPath
          if (Test-Path mesa/x64/libglapi.dll) { Copy-Item mesa/x64/libglapi.dll -Destination $dllPath }
          'GALLIUM_DRIVER=llvmpipe' | Out-File -FilePath $env:GITHUB_ENV -Append
          'LP_NUM_THREADS=2' | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Check for a native OpenGL context on Intel macOS
        if: runner.os == 'macOS'
        run: |
          clang -Wno-deprecated-declarations -framework OpenGL -x c -o "$RUNNER_TEMP/parkourse-gl" - <<'EOF_C'
          #include <OpenGL/OpenGL.h>
          #include <stdio.h>
          int main(void) {
            CGLPixelFormatAttribute attrs[] = {
              kCGLPFAAccelerated, kCGLPFAOpenGLProfile,
              (CGLPixelFormatAttribute)kCGLOGLPVersion_4_1_Core,
              (CGLPixelFormatAttribute)0
            };
            CGLContextObj context;
            CGLPixelFormatObj format = NULL;
            GLint count = 0;
            CGLError error = CGLChoosePixelFormat(attrs, &format, &count);
            if (error || !format || !count) {
              fprintf(stderr, "The VM cannot provide the accelerated OpenGL 4.1 format Minecraft needs.\n");
              return 1;
            }
            error = CGLCreateContext(format, NULL, &context);
            if (error) {
              fprintf(stderr, "The VM could not create a native OpenGL context (%d).\n", error);
              return 1;
            }
            puts("Native OpenGL context available.");
            return 0;
          }
          EOF_C
          "$RUNNER_TEMP/parkourse-gl"
      - name: Connect a graphical Minecraft client and spectate
        run: python .github/platform-check.py client
      - name: Save Minecraft test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-${{ matrix.os }}
          path: platform-runtime/*.log
