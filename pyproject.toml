[project]
name = "cs175-parkourse"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["ruff"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # import order
    "UP",  # Python 3.11 idioms
    "ANN", # function annotations
    "ARG", # unused arguments
    "B",   # common bugs
    "C4",  # comprehensions
    "SIM", # simplifications
    "PIE", # unnecessary code
    "PGH", # lint and type suppression hygiene
    "RUF", # Ruff-specific checks
]
# Let the formatter handle line wrapping.
ignore = ["E501"]
